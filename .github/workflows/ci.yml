name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          dune-cache: true

      - name: Install dependencies
        run: |
          opam install . --deps-only --with-test
          opam install -y js_of_ocaml js_of_ocaml-ppx

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune test

      - name: Build LSP server
        run: opam exec -- dune build lsp/lsp_main.exe

      - name: LSP protocol test
        run: opam exec -- dune test lsp/test --force

      - name: Run examples
        run: |
          for f in examples/*.bagl; do
            echo "== $f =="
            opam exec -- dune exec baglc -- "$f"
          done

      - name: Build browser playground
        run: |
          opam exec -- dune build --profile release js/bagl_js.bc.js
          node -e "
            const m = require('./_build/default/js/bagl_js.bc.js');
            const r = m.bagl.run('grad (fn x -> x * x * x) 2.0');
            if (!r.ok || r.value !== '12.') { console.error(r); process.exit(1); }
            console.log('playground bundle OK:', JSON.stringify(r));
          "

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install the docs site's packages
        working-directory: site
        run: npm ci

      # Every example on the site (home page, playground, reference) runs through
      # the compiler built above, and through the copy the site ships.
      - name: Verify site examples
        working-directory: site
        run: |
          node scripts/verify.mjs ../_build/default/js/bagl_js.bc.js
          node scripts/verify.mjs

      - name: Build the docs site
        working-directory: site
        run: npm run build

      # GitHub Pages serves docs/ from main, so a change to the site must come
      # with its published build.
      - name: Check that docs/ holds the current build
        run: |
          node site/scripts/publish.mjs
          git status --porcelain docs
          test -z "$(git status --porcelain docs)" || { echo "docs/ is out of date: run npm run build && npm run publish in site/"; exit 1; }
