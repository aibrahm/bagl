<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Bagl">
  <!-- The Bagl mark: a lambda drawn with two strokes in a square, in the
       style of abdelrahmanibrm.com (black on white, hairline corners). -->
  <style>
    .box { fill: #000; }
    .l { stroke: #fff; }
    @media (prefers-color-scheme: dark) { .box { fill: #ededed; } .l { stroke: #0c0c0c; } }
  </style>
  <rect class="box" x="0.5" y="0.5" width="23" height="23" rx="3"/>
  <path class="l" d="M6 4.75h2.1L18 19.25M12.85 11.6 6.5 19.25" fill="none" stroke-width="2.1" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
